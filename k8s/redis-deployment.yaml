apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: aegisbank }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379, name: redis }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 10, periodSeconds: 10 }
          securityContext: { runAsNonRoot: true, runAsUser: 999, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
