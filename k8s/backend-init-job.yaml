# Runs ONCE per release before the API rolls out: migrations + synthetic seed (idempotent). Avoids replicas racing on first boot.
apiVersion: batch/v1
kind: Job
metadata: { name: backend-init, namespace: aegisbank }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: init
          image: ghcr.io/your-org/aegisbank-backend:latest
          command: ["/app/scripts/start.sh", "init"]
          envFrom: [{ configMapRef: { name: aegis-config } }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: aegis-secrets, key: DATABASE_URL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: aegis-secrets, key: JWT_SECRET } } }
            - { name: ML_MODEL_PATH, value: /tmp/isolation_forest.joblib }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
