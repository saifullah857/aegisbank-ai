name: CD
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions: { contents: read, packages: write }
concurrency: { group: cd-production, cancel-in-progress: false }

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  NAMESPACE: aegisbank

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: "${{ env.REGISTRY }}", username: "${{ secrets.REGISTRY_USERNAME }}", password: "${{ secrets.REGISTRY_PASSWORD }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: true, tags: "${{ env.IMAGE_PREFIX }}/aegisbank-backend:${{ github.sha }},${{ env.IMAGE_PREFIX }}/aegisbank-backend:latest", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: true, tags: "${{ env.IMAGE_PREFIX }}/aegisbank-frontend:${{ github.sha }},${{ env.IMAGE_PREFIX }}/aegisbank-frontend:latest", cache-from: "type=gha", cache-to: "type=gha,mode=max" }

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [publish]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Namespace, config and secrets (secrets come from GitHub Actions, never from Git)
        run: |
          kubectl apply -f k8s/namespace.yaml -f k8s/configmap.yaml
          kubectl -n "$NAMESPACE" create secret generic aegis-secrets \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Data tier
        run: |
          kubectl apply -f k8s/postgres-service.yaml -f k8s/postgres-statefulset.yaml -f k8s/redis-service.yaml -f k8s/redis-deployment.yaml
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=300s
      - name: Run migrations + seed (Job)
        run: |
          kubectl -n "$NAMESPACE" delete job backend-init --ignore-not-found
          sed "s#ghcr.io/your-org/aegisbank-backend:latest#$IMAGE_PREFIX/aegisbank-backend:${{ github.sha }}#" k8s/backend-init-job.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/backend-init --timeout=600s
      - name: Roll out application
        run: |
          for f in backend-deployment frontend-deployment; do
            sed -e "s#ghcr.io/your-org/aegisbank-backend:latest#$IMAGE_PREFIX/aegisbank-backend:${{ github.sha }}#" \
                -e "s#ghcr.io/your-org/aegisbank-frontend:latest#$IMAGE_PREFIX/aegisbank-frontend:${{ github.sha }}#" k8s/$f.yaml | kubectl apply -f -
          done
          kubectl apply -f k8s/backend-service.yaml -f k8s/frontend-service.yaml -f k8s/ingress.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s
      - name: Health check
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/backend 18000:8000 &
          sleep 5
          for i in $(seq 1 20); do curl -sf http://localhost:18000/api/v1/health/ready && break || sleep 3; done
          curl -sf http://localhost:18000/api/v1/health
      - name: Deployment complete
        run: echo "AegisBank AI ${{ github.sha }} deployed to namespace $NAMESPACE"
